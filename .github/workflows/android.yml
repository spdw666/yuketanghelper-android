name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest already ships the Android SDK. setup-android@v3 is avoided because it
      # hard-fails on the removed "tools" package.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android platform 35 and build-tools 35.0.0
        run: |
          set -e
          SDK="${ANDROID_HOME}"
          SM="$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager 2>/dev/null | head -1)"
          need=""
          [ -d "$SDK/platforms/android-35" ] || need="$need platforms;android-35"
          [ -d "$SDK/build-tools/35.0.0" ] || need="$need build-tools;35.0.0"
          echo "SDK=$SDK sdkmanager=$SM missing=[$need]"
          if [ -n "$need" ] && [ -n "$SM" ]; then yes | "$SM" $need > /dev/null; fi
          ls "$SDK/platforms" "$SDK/build-tools"

      # The checked-in settings prefer domestic mirrors. They answer 502 from this network and
      # Gradle then disables the repository for the whole build, so CI resolves through
      # google()/mavenCentral() instead. Local builds keep the mirrors.
      - name: Use official Maven repositories on the runner
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts

      # The checked-in wrapper points at a domestic mirror; runners use the canonical URL.
      # The SHA-256 check in gradle-wrapper.properties still applies to the same archive.
      - name: Point the wrapper at the canonical Gradle distribution
        run: sed -i 's#https://repo.huaweicloud.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint (report only)
        if: always()
        run: ./gradlew :app:lintDebug --stacktrace || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yukehelper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
